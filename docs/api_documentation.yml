  # Products Endpoints
  /categories:
    get:
      tags:
        - Products
      summary: List all the categories
      operationId: listCategories
      responses:
        "200":
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /products:
    get:
      tags:
        - Products
      summary: List all products with pagination
      description: Retrieve paginated list of available products. Accessible to all users (authenticated and non-authenticated).
      operationId: listProducts
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number for pagination
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Items per page
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [name, price, created_at]
            default: created_at
          description: Field to sort by
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort order
        - name: category_id
          in: query
          schema:
            type: string
            format: uuid
          description: Category ID to filter by
        - name: name
          in: query
          schema:
            type: string
          description: Product name filter (partial match)
        - name: min_price
          in: query
          schema:
            type: number
            format: double
            minimum: 0
          description: Minimum price filter
        - name: max_price
          in: query
          schema:
            type: number
            format: double
            minimum: 0
          description: Maximum price filter
      responses:
