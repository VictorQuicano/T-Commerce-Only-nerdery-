                        type: integer
                      total:
                        type: integer
                      total_pages:
                        type: integer
        "404":
          $ref: "#/components/responses/NotFoundError"
  # Authentication Endpoints
  /users:
    post:
      tags:
        - Authentication
      summary: Create user
      description: Creates a new user account with the provided registration data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /sessions:
    post:
      tags:
        - Authentication
      summary: Authenticate user
      description: Sign in with email and password. Returns JWT tokens.
      operationId: signin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    delete:
      tags:
        - Authentication
      summary: Sign out user
      description: Invalidate user's current session
      operationId: signout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sign out successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /password-resets:
    post:
      tags:
        - Authentication
      summary: Request password reset
      description: Send password reset email to the provided email address
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Reset email sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /password-resets/{token}:
    put:
      tags:
        - Authentication
      summary: Reset password
      description: Resets a user's password using a valid password reset token.
      operationId: resetPassword
      parameters:
        - name: token
          in: path
          required: true
          description: Password reset token sent via email
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password reset successfully
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          description: Password reset token not found
        "410":
          description: Password reset token has expired

  /sessions/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: |
        Generates a new access token using a valid refresh token.
        If refresh token rotation is enabled, a new refresh token will also be issued.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: Valid refresh token previously issued by the authentication server.
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh.token
      responses:
        "200":
          description: Tokens successfully refreshed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    description: Newly generated JWT access token.
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.access.token
                  refreshToken:
                    type: string
                    description: New refresh token (returned if rotation is enabled).
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.new.refresh.token
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  # User Endpoints
  /me:
    get:
      tags:
        - Profile
      summary: Get current user profile
      description: Retrieve the authenticated user's profile information
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

    patch:
      tags:
        - Profile
      summary: Update user personal data
      description: Update authenticated user's personal information (first_name, middle_name, last_name)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserProfileRequest"
      responses:
        "200":
          description: User profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User profile updated successfully"
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

    delete:
      tags:
        - Profile
      summary: Delete user account
      description: Delete the authenticated user's account permanently. This action cannot be undone.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
      responses:
        "204":
          description: Account deleted successfully
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /me/change-password:
    post:
      tags:
        - Profile
      summary: Change user password
      description: Change the password for the authenticated user. Requires the current password for verification.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Password changed successfully"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  # User Adresses management
  /me/addresses:
    get:
      summary: Get current user addresses
      description: Retrieve all addresses for the authenticated user
      operationId: getUserAddresses
      tags:
        - Profile Addresses
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: List of user addresses
          content:
            application/json:
