            type: string
            format: uuid
          description: Product ID to delete
      responses:
        "204":
          description: Product deleted successfully
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /manager/products/{productId}/images:
    post:
      tags:
        - Manager (Products & Categories)
      summary: Upload product image
      description: Upload an image for a product. Multiple images can be uploaded with different order values. Manager role required.
      operationId: uploadProductImage
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
