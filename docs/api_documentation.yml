      description: Retrieve all orders from all clients with pagination. Manager role required.
      operationId: getManagerOrders
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, PAID, CANCELLED, SHIPPED, DELIVERED]
          description: Filter by order status
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by specific user
      responses:
        "200":
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedOrders"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
  /manager/orders/{orderId}/status:
    put:
      tags:
        - Manager (Orders)
      summary: Update order status
      description: Change the status of a specific order. Manager role required.

      operationId: changeOrderStatus
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Order ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: "#/components/schemas/OrderStatus"
              required:
                - status

      responses:
        "200":
          description: Order Status changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /manager/clients:
