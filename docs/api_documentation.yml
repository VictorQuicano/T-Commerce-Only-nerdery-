  # Stripe Webhooks - Stateless Event Processing
  /webhooks/stripe:
    post:
      tags:
        - Payments
      summary: Handle Stripe webhook events
      description: |
        Webhook endpoint for Stripe events.

        Security requirements:
        - Requests MUST include the `Stripe-Signature` header.
        - The request body must be validated using the Stripe webhook signing secret.
        - Requests with invalid or missing signatures are rejected with 400.

        Supported events:
        - payment_intent.succeeded
        - payment_intent.payment_failed
        - payment_intent.canceled
        - charge.refunded
      operationId: handleStripeWebhook
      parameters:
        - in: header
          name: Stripe-Signature
          required: true
          schema:
            type: string
          description: >
            Stripe-generated signature used to verify the authenticity
            of the webhook payload. Required for all webhook requests.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeWebhookRequest"
      responses:
        "200":
          description: Webhook received and queued for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid webhook signature or format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

security:
  - bearerAuth: []
