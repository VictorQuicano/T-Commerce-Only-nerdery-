openapi: 3.1.0

info:
  title: T-Commerce API - Products Section
  version: 1.0.0
  description: Product-related endpoints for the e-commerce platform

tags:
  - name: Authentication
    description: User authentication endpoints
  - name: Products
    description: Product management and retrieval
  - name: Cart
    description: Shopping cart operations
  - name: Orders
    description: Order management
  - name: Payments
    description: Payment processing with Stripe
  - name: Manager
    description: Manager-specific operations

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authenticated requests

  schemas:
    # Auth Schemas
    SignUpRequest:
      type: object
      required:
        - first_name
        - last_name
        - email
        - password
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        middle_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          pattern: '(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])'
          description: Must contain uppercase, lowercase, number and special character
    SignInRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        user:
          $ref: '#/components/schemas/User'


    # User Schemas
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        first_name:
          type: string
        middle_name:
          type: string
          nullable: true
        last_name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Role:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    # Products SCHEMAS
    Product:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          format: double
          minimum: 0
        available:
          type: boolean
        category:
          $ref: '#/components/schemas/Category'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
        liked_by_user:
          type: boolean
          description: Only present for authenticated requests
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductImage:
      type: object
      properties:
        id:
          type: integer
          format: int64
        image_url:
          type: string
          format: uri
        order:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        created_at:
          type: string
          format: date-time
    PaginatedProducts:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        pagination:
          type: object
          properties:
            page:
              type: integer
              minimum: 1
            per_page:
              type: integer
              minimum: 1
            total:
              type: integer
            total_pages:
              type: integer
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              nullable: true

    ProductUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        price:
          type: number
          format: double
          minimum: 0
        category_id:
          type: integer
          format: int64
        available:
          type: boolean
    ProductCreateRequest:
      type: object
      required:
        - name
        - price
        - category_id
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        price:
          type: number
          format: double
          minimum: 0
        category_id:
          type: integer
          format: int64
        available:
          type: boolean
          default: true

    # Carts Schema
    CartItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
    Cart:
      type: object
      properties:
        id:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        total:
          type: number
          format: double
        created_at:
          type: string
          format: date-time
    AddToCartRequest:
      type: object
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
    UpdateCartItemRequest:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: integer
          minimum: 1

    # Payment Schemas
    Payment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        order_id:
          type: integer
          format: int64
        amount:
          type: number
          format: double
        status:
          type: string
          enum: [PENDING, PROCESSING, PAID, FAILED, CANCELLED, REFUNDED]
        description:
          type: string
          nullable: true
        payment_intent:
          $ref: '#/components/schemas/PaymentIntent'
        paid_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    PaymentIntent:
      type: object
      properties:
        id:
          type: integer
          format: int64
        stripe_payment_intent_id:
          type: string
        status:
          type: string
          enum: [REQUIRES_PAYMENT_METHOD, REQUIRES_CONFIRMATION, REQUIRES_ACTION, PROCESSING, SUCCESS, CANCELED]

    CreatePaymentRequest:
      type: object
      required:
        - order_id
      properties:
        order_id:
          type: integer
          format: int64

    PaymentResponse:
      type: object
      properties:
        client_secret:
          type: string
          description: Stripe client secret for frontend payment processing
        payment_intent_id:
          type: string
    # Order Schemas
    OrderItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          type: integer
        price:
          type: number
          format: double
        created_at:
          type: string
          format: date-time

    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user:
          $ref: '#/components/schemas/User'
        status:
          type: string
          enum: [ PENDING, PAID, CANCELLED, SHIPPED, DELIVERED ]
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total_amount:
          type: number
          format: double
        payment:
          $ref: '#/components/schemas/Payment'
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateOrderRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - product_id
              - quantity
            properties:
              product_id:
                type: integer
                format: int64
              quantity:
                type: integer
                minimum: 1
    PaginatedOrders:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        pagination:
          type: object
          properties:
            page:
              type: integer
              minimum: 1
            per_page:
              type: integer
              minimum: 1
            total:
              type: integer
            total_pages:
              type: integer

    # Response Schemas
    SuccessResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object

  responses:
    UnauthorizedError:
      description: Authentication token is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ForbiddenError:
      description: User lacks required permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ConflictError:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:
  # Authentication Endpoints
  /auth/sign-up:
    post:
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/sign-in:
    post:
      tags:
        - Authentication
      summary: Authenticate user
      description: Sign in with email and password. Returns JWT tokens.
      operationId: signin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/sign-out:
    post:
      tags:
        - Authentication
      summary: Sign out user
      description: Invalidate user's current session
      operationId: signout
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Sign out successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request password reset
      description: Send password reset email to the provided email address
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Reset email sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password
      description: Reset user password using token from email
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'


  # Products
  /products:
    get:
      tags:
        - Products
      summary: List all products with pagination
      description: Retrieve paginated list of available products. Accessible to all users (authenticated and non-authenticated).
      operationId: listProducts
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number for pagination
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Items per page
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [name, price, created_at]
            default: created_at
          description: Field to sort by
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort order
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProducts'

  /products/search:
    get:
      tags:
        - Products
      summary: Search products by category
      description: Search and filter products by category with pagination. Accessible to all users.
      operationId: searchProducts
      parameters:
        - name: category_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
          description: Category ID to filter by
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Items per page
        - name: name
          in: query
          schema:
            type: string
          description: Product name filter (partial match)
        - name: min_price
          in: query
          schema:
            type: number
            format: double
            minimum: 0
          description: Minimum price filter
        - name: max_price
          in: query
          schema:
            type: number
            format: double
            minimum: 0
          description: Maximum price filter
      responses:
        '200':
          description: Search results retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProducts'

  /products/{productId}:
    get:
      tags:
        - Products
      summary: Get product details
      description: Retrieve detailed information about a specific product including images. Accessible to all users.
      operationId: getProductDetail
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Product ID
      responses:
        '200':
          description: Product details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # Cart
  /cart:
    get:
      tags:
        - Cart
      summary: Get user's cart
      operationId: getCart
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Cart retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /cart/items:
    post:
      tags:
        - Cart
      summary: Add item to cart
      operationId: addToCart
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartRequest'
      responses:
        '201':
          description: Item added to cart successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /cart/items/{cartItemId}:
    put:
      tags:
        - Cart
      summary: Update cart item quantity
      operationId: updateCartItem
      security:
        - bearerAuth: [ ]
      parameters:
        - name: cartItemId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Cart item ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
      responses:
        '200':
          description: Cart item updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags:
        - Cart
      summary: Remove item from cart
      operationId: removeFromCart
      security:
        - bearerAuth: [ ]
      parameters:
        - name: cartItemId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Cart item ID
      responses:
        '204':
          description: Item removed from cart successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /cart/clear:
    delete:
      tags:
        - Cart
      summary: Clear entire cart
      operationId: clearCart
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Cart cleared successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # Orders Endpoints - Client
  /orders:
    post:
      tags:
        - Orders
      summary: Create order from cart
      operationId: createOrder
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    get:
      tags:
        - Orders
      summary: Get user's orders
      operationId: getUserOrders
      security:
        - bearerAuth: [ ]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: status
          in: query
          schema:
            type: string
            enum: [ PENDING, PAID, CANCELLED, SHIPPED, DELIVERED ]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrders'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /orders/{orderId}:
    get:
      tags:
        - Orders
      summary: Get order details
      operationId: getOrderDetail
      security:
        - bearerAuth: [ ]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Order ID
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    patch:
      tags:
        - Orders
      summary: Cancel order
      operationId: cancelOrder
      security:
        - bearerAuth: [ ]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Order ID
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # Payments Endpoints - Stripe Integration
  /payments:
    post:
      tags:
        - Payments
      summary: Create payment intent
      operationId: createPaymentIntent
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /payments/{paymentId}:
    get:
      tags:
        - Payments
      summary: Get payment details
      operationId: getPaymentDetail
      security:
        - bearerAuth: [ ]
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Payment ID
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /payments/{paymentId}/cancel:
    patch:
      tags:
        - Payments
      summary: Cancel payment
      operationId: cancelPayment
      security:
        - bearerAuth: [ ]
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Payment ID
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # Manager-Only
  /manager/products:
    post:
      tags:
        - Manager
      summary: Create a new product
      operationId: createProduct
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /manager/products/{productId}:
    put:
      tags:
        - Manager
      summary: Update product
      operationId: updateProduct
      security:
        - bearerAuth: [ ]
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Product ID to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    delete:
      tags:
        - Manager
      summary: Delete product
      description: Permanently delete a product. Manager role required.
      operationId: deleteProduct
      security:
        - bearerAuth: [ ]
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Product ID to delete
      responses:
        '204':
          description: Product deleted successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /manager/products/{productId}/disable:
    put:
      tags:
        - Manager
      summary: Disable product
      description: Disable a product without deleting it. Manager role required.
      operationId: disableProduct
      security:
        - bearerAuth: [ ]
      parameters:
