openapi: 3.0.0

info:
  title: T-Commerce API
  version: 1.0.0
  description: E-commerce platform API with authentication, product management, and Stripe payment integration

tags:
  - name: Common
    description: General endpoints
  - name: Authentication
    description: User authentication endpoints
  - name: Profile
    description: User profile
  - name: Profile Addresses
    description: User Addresses
  - name: Products
    description: Product management and retrieval
  - name: Cart
    description: Shopping cart operations
  - name: Orders
    description: Order management
  - name: Payments
    description: Payment processing with Stripe
  - name: Manager (Products & Categories)
    description: Create Update Products
  - name: Manager (Orders)
    description: List, Update Orders
  - name: Manager (Clients)
    description: List, Update Clients

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authenticated requests

  schemas:
    # Auth Schemas
    SignUpRequest:
      type: object
      required:
        - first_name
        - last_name
        - email
        - password
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        middle_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          pattern: '(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])'
          description: Must contain uppercase, lowercase, number and special character
        password_confirmation:
          type: string
          minLength: 8
          pattern: '(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])'
          description: Must contain uppercase, lowercase, number and special character and be equals to the

    SignInRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
          pattern: '(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])'
          description: Must contain uppercase, lowercase, number and special character

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    # User Schemas
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        middle_name:
          type: string
          nullable: true
        last_name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        created_at:
          type: string
          format: date-time

    UpdateUserProfileRequest:
      type: object
      properties:
        first_name:
          type: string
        middle_name:
          type: string
          nullable: true
        last_name:
          type: string
        email:
          type: string
          format: email
    UpdateClientProfile:
      type: object
      properties:
        first_name:
          type: string
        middle_name:
          type: string
          nullable: true
        last_name:
          type: string
        email:
          type: string
          format: email
        roleid:
          type: string
          format: uuid
    DeleteAccountRequest:
      type: object
      required:
        - password
        - confirm
      properties:
        password:
          type: string
          format: password
        confirm:
          type: boolean
          example: true
    ChangePasswordRequest:
      type: object
      required:
        - old_password
        - new_password
        - new_password_confirmation
      properties:
        old_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
          pattern: '(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])'
          description: Must contain uppercase, lowercase, number and special character
        new_password_confirmation:
          type: string
          format: password
          minLength: 8
          pattern: '(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])'
          description: Must contain uppercase, lowercase, number and special character
    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    PaginatedClients:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        pagination:
          type: object
          properties:
            page:
              type: integer
              minimum: 1
            per_page:
              type: integer
              minimum: 1
            total:
              type: integer
            total_pages:
              type: integer

    # Location Schemas
    Country:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone_code:
          type: string

    Department:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    Province:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    District:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    # Address Schemas
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
        district:
          $ref: "#/components/schemas/District"
        department:
          $ref: "#/components/schemas/Department"
        province:
          $ref: "#/components/schemas/Province"
        country:
          $ref: "#/components/schemas/Country"
        address:
          type: string
        reference:
          type: string
          nullable: true
        zip_code:
          type: string
          maxLength: 10
        phone:
          type: string
          maxLength: 20
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateAddressRequest:
      type: object
      required:
        - district_id
        - address
        - phone
      properties:
        district_id:
          type: string
          format: uuid
        address:
          type: string
          minLength: 1
          maxLength: 255
        reference:
          type: string
          nullable: true
          maxLength: 500
        zip_code:
          type: string
          maxLength: 10
        phone:
          type: string
          maxLength: 20
        is_default:
          type: boolean
          default: false

    UpdateAddressRequest:
      type: object
      properties:
        district_id:
          type: string
          format: uuid
        address:
          type: string
          minLength: 1
          maxLength: 255
        reference:
          type: string
          nullable: true
          maxLength: 500
        zip_code:
          type: string
          maxLength: 10
        phone:
          type: string
          maxLength: 20
        is_default:
          type: boolean

    PaginatedAddresses:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Address"
        pagination:
          type: object
          properties:
            page:
              type: integer
              minimum: 1
            per_page:
              type: integer
              minimum: 1
            total:
              type: integer
            total_pages:
              type: integer
    # Warehouse
    Warehouse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        address:
          $ref: "#/components/schemas/Address"
        admin_id:
          type: string
          format: uuid
        admin:
          $ref: "#/components/schemas/User"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateWarehouseRequest:
      type: object
      required:
        - district_id
        - admin_id
        - address
        - phone
      properties:
        district_id:
          type: string
          format: uuid
        address:
          type: string
          minLength: 1
          maxLength: 255
        reference:
          type: string
          nullable: true
          maxLength: 500
        zip_code:
          type: string
          maxLength: 10
        phone:
          type: string
          maxLength: 20
        admin_id:
          type: string
          format: uuid

    UpdateWarehouseRequest:
      type: object
      properties:
        district_id:
          type: string
          format: uuid
        address:
          type: string
          minLength: 1
          maxLength: 255
        reference:
          type: string
          nullable: true
          maxLength: 500
        zip_code:
          type: string
          maxLength: 10
        phone:
          type: string
          maxLength: 20
        admin_id:
          type: string
          format: uuid

    PaginatedWarehouses:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Warehouse"
        pagination:
          type: object
          properties:
            page:
              type: integer
              minimum: 1
            per_page:
              type: integer
              minimum: 1
            total:
              type: integer
            total_pages:
              type: integer

    # Stock
    StockLevel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product:
          $ref: "#/components/schemas/Product"
        quantity:
          type: integer
          minimum: 0
        warehouse:
          $ref: "#/components/schemas/Warehouse"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateStockRequest:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: integer
          minimum: 0
    # Discounts
    DiscountType:
      type: string
      enum: [PERCENTAGE, FIXED]

    DiscountRelation:
      type: string
      enum: [PRODUCT, CATEGORY]

    Discount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: "#/components/schemas/DiscountType"
        value:
          type: number
          format: double
          minimum: 0
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true

    CreateDiscountRequest:
      type: object
      required:
        - name
        - type
        - value
        - start_date
        - end_date
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        type:
          $ref: "#/components/schemas/DiscountType"
        value:
          type: number
          format: double
          minimum: 0
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time

    UpdateDiscountRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        type:
          $ref: "#/components/schemas/DiscountType"
        value:
          type: number
          format: double
          minimum: 0
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time

    DiscountItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        discount:
          $ref: "#/components/schemas/Discount"
        relation_type:
          $ref: "#/components/schemas/DiscountRelation"
        item_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AssignDiscountRequest:
      type: object
      required:
        - item_id
        - relation_type
      properties:
        item_id:
          type: string
          format: uuid
        relation_type:
          $ref: "#/components/schemas/DiscountRelation"

    PaginatedDiscounts:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Discount"
        pagination:
          type: object
          properties:
            page:
              type: integer
              minimum: 1
            per_page:
              type: integer
              minimum: 1
            total:
              type: integer
            total_pages:
              type: integer

    # Product Schemas
    ProductStatus:
      type: string
      enum: [AVAILABLE, DELETED, WITHOUT_STOCK]

    ProductDiscount:
      type: object
      properties:
        discount:
          $ref: "#/components/schemas/Discount"
        relation_type:
          $ref: "#/components/schemas/DiscountRelation"

    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          format: double
          minimum: 0
        available:
          type: boolean
        status:
          $ref: "#/components/schemas/ProductStatus"
        category:
          $ref: "#/components/schemas/Category"
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"
        discounts:
          type: array
          items:
            $ref: "#/components/schemas/ProductDiscount"
        liked_by_user:
          type: boolean
          description: Only present for authenticated requests
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductCreateRequest:
      type: object
      required:
        - name
        - price
        - category_id
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        price:
          type: number
          format: double
          minimum: 0
        category_id:
          type: string
          format: uuid
        images:
          type: array
          minItems: 1
          items:
            type: string
        available:
          type: boolean
          default: true

    ProductUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        price:
          type: number
          format: double
          minimum: 0
        category_id:
          type: string
          format: uuid
        available:
          type: boolean

    ProductImage:
      type: object
      properties:
        image_url:
          type: string
          format: uri
        order:
          type: integer
          minimum: 0
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    CategoryCreateRequest:
      type: object
      properties:
        name:
          type: string

    PaginatedProducts:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        pagination:
          type: object
          properties:
            page:
              type: integer
              minimum: 1
            per_page:
              type: integer
              minimum: 1
            total:
              type: integer
            total_pages:
              type: integer

    # Cart Schemas
    CartItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product:
          $ref: "#/components/schemas/Product"
        quantity:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time

    Cart:
      type: object
      properties:
        id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        total:
          type: number
          format: double
        created_at:
          type: string
          format: date-time

    AddToCartRequest:
      type: object
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1

    UpdateCartItemRequest:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: integer
          minimum: 1

    # Order Schemas
    OrderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product_uuid:
          type: string
          format: uuid
        product_name:
          type: string
        unit_price:
          type: number
          format: double
        discount:
          type: number
          format: double
        quantity:
          type: integer
        price:
          type: number
          format: double
        created_at:
          type: string
          format: date-time

    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user:
          $ref: "#/components/schemas/User"
        status:
          $ref: "#/components/schemas/OrderStatus"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        total_amount:
          type: number
          format: double
        payment:
          $ref: "#/components/schemas/Payment"
          nullable: true

    CreateOrderRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - product_id
              - quantity
            properties:
              product_id:
                type: integer
                format: int64
              quantity:
                type: integer
                minimum: 1

    PaginatedOrders:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        pagination:
          type: object
          properties:
            page:
              type: integer
              minimum: 1
            per_page:
              type: integer
              minimum: 1
            total:
              type: integer
            total_pages:
              type: integer

    # Payment Schemas
    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        amount:
          type: number
          format: double
        status:
          type: string
          enum: [PENDING, PROCESSING, PAID, FAILED, CANCELLED, REFUNDED]
        description:
          type: string
          nullable: true
        payment_intent:
          $ref: "#/components/schemas/PaymentIntent"
          nullable: true
        paid_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    PaymentIntent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        stripe_payment_intent_id:
          type: string
        status:
          type: string
          enum:
            [
              REQUIRES_PAYMENT_METHOD,
              REQUIRES_CONFIRMATION,
              REQUIRES_ACTION,
              PROCESSING,
              SUCCESS,
              CANCELED,
            ]

    CreatePaymentRequest:
      type: object
      required:
        - order_id
      properties:
        order_id:
          type: string
          format: uuid

    PaymentResponse:
      type: object
      properties:
        client_secret:
          type: string
          description: Stripe client secret for frontend payment processing
        payment_intent_id:
          type: string

    StripeWebhookRequest:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        data:
          type: object

    # HISTORIALS
    OrderStatus:
      type: string
      enum: [PENDING, PAID, CANCELLED, SHIPPED, DELIVERED]

    OrderStatusHistory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
          nullable: true
        from_status:
          $ref: "#/components/schemas/OrderStatus"
          nullable: true
        to_status:
          $ref: "#/components/schemas/OrderStatus"
        changed_by:
          $ref: "#/components/schemas/User"
        reason:
          type: string
          nullable: true
          maxLength: 255
        changed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    PaginatedOrderStatusHistory:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OrderStatusHistory"
        pagination:
          type: object
          properties:
            page:
              type: integer
              minimum: 1
            per_page:
              type: integer
              minimum: 1
            total:
              type: integer
            total_pages:
              type: integer

    PaymentStatus:
      type: string
      enum: [PENDING, PROCESSING, PAID, FAILED, CANCELLED, REFUNDED]

    PaymentStatusHistory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        payment_id:
          type: string
          format: uuid
        from_status:
          $ref: "#/components/schemas/PaymentStatus"
          nullable: true
        to_status:
          $ref: "#/components/schemas/PaymentStatus"
        reason:
          type: string
          nullable: true
          maxLength: 255
        changed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    PaginatedPaymentStatusHistory:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PaymentStatusHistory"
        pagination:
          type: object
          properties:
            page:
              type: integer
              minimum: 1
            per_page:
              type: integer
              minimum: 1
            total:
              type: integer
            total_pages:
              type: integer

    PaymentIntentStatus:
      type: string
      enum:
        [
          REQUIRES_PAYMENT_METHOD,
          REQUIRES_CONFIRMATION,
          REQUIRES_ACTION,
          PROCESSING,
          SUCCESS,
          CANCELED,
        ]

    PaymentIntentStatusHistory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        payment_intent_id:
          type: string
          format: uuid
        from_status:
          $ref: "#/components/schemas/PaymentIntentStatus"
          nullable: true
        to_status:
          $ref: "#/components/schemas/PaymentIntentStatus"
        reason:
          type: string
          nullable: true
          maxLength: 255
        changed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    PaginatedPaymentIntentStatusHistory:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PaymentIntentStatusHistory"
        pagination:
          type: object
          properties:
            page:
              type: integer
              minimum: 1
            per_page:
              type: integer
              minimum: 1
            total:
              type: integer
            total_pages:
              type: integer
    # Payments with details
    PaymentIntentWithHistory:
      allOf:
        - $ref: "#/components/schemas/PaymentIntent"
        - type: object
          properties:
            status_history:
              type: array
              items:
                $ref: "#/components/schemas/PaymentIntentStatusHistory"

    PaymentWithDetails:
      allOf:
        - $ref: "#/components/schemas/Payment"
        - type: object
          properties:
            status_history:
              type: array
              items:
                $ref: "#/components/schemas/PaymentStatusHistory"
            payment_intent_with_history:
              $ref: "#/components/schemas/PaymentIntentWithHistory"
              nullable: true

    # Orders with historial
    OrderWithHistory:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          properties:
            status_history:
              type: array
              items:
                $ref: "#/components/schemas/OrderStatusHistory"

    # Error Response
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              nullable: true

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: >
            A URI reference that identifies the problem type.
            It should be stable and resolvable to human-readable documentation.
          example: https://example.com/problems/invalid-parameter

        title:
          type: string
          description: A short, human-readable summary of the problem type
          example: Invalid parameter

        status:
          type: integer
          format: int32
          description: The HTTP status code generated by the server
          example: 400

        detail:
          type: string
          description: A human-readable explanation specific to this occurrence
          example: The 'age' parameter must be a positive integer.

        instance:
          type: string
          format: uri
          description: A URI reference that identifies the specific occurrence
          example: /users/123

    ValidationProblemDetails:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          properties:
            invalidParams:
              type: array
              description: List of invalid request parameters
              items:
                type: object
                required:
                  - name
                  - reason
                properties:
                  name:
                    type: string
                    description: Name of the invalid parameter
                    example: age
                  reason:
                    type: string
                    description: Reason why the parameter is invalid
                    example: Must be a positive integer

    SuccessResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object

  responses:
    UnauthorizedError:
      description: Authentication token is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ForbiddenError:
      description: User lacks required permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ConflictError:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationProblemDetails"

paths:
