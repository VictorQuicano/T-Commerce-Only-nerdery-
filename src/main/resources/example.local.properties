spring.application.name=TCommerce

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.docker.compose.enabled=false

spring.datasource.url=<YOUR_DB_URL>
spring.datasource.username=<YOUR_DB_USERNAME>
spring.datasource.password=<YOUR_DB_PASSWORD>
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=540000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

server.port=8080
server.domain=http://localhost:8080

logging.level.org.springframework=DEBUG
logging.level.org.hibernate=ERROR

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

spring.cloud.gcp.project-id=<YOUR_GCP_PROJECT_ID>
spring.cloud.gcp.credentials.location=<YOUR_GCP_CREDENTIALS_LOCATION>

application.security.jwt.secret-key=<YOUR_JWT_SECRET_KEY>
application.security.jwt.expiration=<YOUR_JWT_EXPIRATION>
application.security.jwt.cookie-name=<YOUR_JWT_COOKIE_NAME>
application.security.jwt.refresh-token.expiration=1296000000
application.security.jwt.refresh-token.cookie-name=refresh-jwt-cookie

gcs.bucket-name=<YOUR_GCS_BUCKET_NAME>
gcs.subdirectory=<YOUR_GCS_BUCKET_SUBDIRECTORY>

# Email Mock Variables
email.mock.enabled=false

# Email SMTP Variables
email.smtp.enabled=false
email.smtp.from=<YOUR_EMAIL_SMTP_FROM>

spring.mail.host=<YOUR_EMAIL_SMTP_HOST>
spring.mail.port=<YOUR_EMAIL_SMTP_PORT>
spring.mail.tls=<YOUR_EMAIL_SMTP_TLS>
spring.mail.username=<YOUR_EMAIL_SMTP_USERNAME>
spring.mail.password=<YOUR_EMAIL_SMTP_PASSWORD>
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Email API Sendgrid Variable
email.rest.sendgrid.enabled=false
email.rest.sendgrid.api-key=<YOUR_EMAIL_REST_SENDGRID_API_KEY>
email.rest.sendgrid.from=<YOUR_EMAIL_REST_SENDGRID_FROM>

email.rest.resend.enabled=true
email.rest.resend.api-key=<YOUR_EMAIL_REST_RESEND_API_KEY>
email.rest.resend.from=<YOUR_EMAIL_REST_RESEND_FROM>

# Stripe Configuration
stripe.secret-key=<YOUR_STRIPE_SECRET_KEY>
stripe.webhook-secret=<YOUR_STRIPE_WEBHOOK_SECRET>

# GraphQL Configuration
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.cloud.gcp.sql.enabled=false
