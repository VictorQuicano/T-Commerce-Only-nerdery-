templates:
  welcome: "Hi {{first_name}} {{last_name}}, thank you for joining us! We're thrilled to have you at T-Commerce. Your account is now active and ready for you to explore our curated collections."
  password-reset: "Hello {{first_name}} {{last_name}}, we received a request to reset your password. Click the following link to choose a new one (If you didn't request this, you can safely ignore this email)."
  password-changed: "Hi {{first_name}} {{last_name}}, this is a confirmation that your password has been successfully changed. If you did not make this change, please contact our support team immediately."
  stock-alert-manager: "<p>Dear {{first_name}} {{last_name}},</p> <p>This is an <strong>urgent stock alert</strong> for the following product:</p> <p> <strong>Product Name:</strong> {{product_name}}<br> <strong>Category:</strong> {{category_name}}<br> <strong>Product ID:</strong> {{product_id}}<br> <strong>Current Stock:</strong> {{stock_quantity}} units<br> <strong>Price:</strong> ${{price}} </p> <p>The inventory level has reached a <strong>critical threshold</strong> and requires immediate replenishment to avoid sales disruption.</p> <p>Please review the inventory and restock this product as soon as possible.</p>"
  stock-alert-client: "<p>Hi {{first_name}},</p> <p>Good news! The product you liked is <strong>almost sold out</strong>.</p> <p> <strong>Product:</strong> {{product_name}}<br> <strong>Category:</strong> {{category_name}}<br> <strong>Price:</strong> ${{price}}<br> <strong>Only {{stock_quantity}} units remaining</strong> </p> <p>Don’t miss your chance to purchase before it’s gone.</p> <p>Complete your order now while it’s still available.</p>"
  stock-warning-manager: "<p>Dear {{first_name}} {{last_name}},</p> <p>This is a <strong>low stock warning</strong> for the following product:</p> <p> <strong>Product Name:</strong> {{product_name}}<br> <strong>Category:</strong> {{category_name}}<br> <strong>Product ID:</strong> {{product_id}}<br> <strong>Current Stock:</strong> {{stock_quantity}} units<br> <strong>Price:</strong> ${{price}} </p> <p>The inventory level is running low. We recommend scheduling replenishment soon to prevent reaching a critical stock level.</p>"
  stock-warning-client: "<p>Hi {{first_name}},</p> <p>The product you liked is <strong>selling fast</strong>.</p> <p> <strong>Product:</strong> {{product_name}}<br> <strong>Category:</strong> {{category_name}}<br> <strong>Price:</strong> ${{price}}<br> <strong>Currently available:</strong> {{stock_quantity}} units </p> <p>Stock is limited, so secure yours soon before availability runs out.</p>"
  not-enough-stock-client: "<p>Hi {{first_name}},</p><p>We’re sorry, but the quantity requested for <strong>{{product_name}}</strong> is currently not available.</p><p><strong>Product:</strong> {{product_name}}<br><strong>Category:</strong> {{category_name}}<br><strong>Price:</strong> ${{price}}<br><strong>Available Stock:</strong> {{stock_quantity}} units</p><p>Please adjust the quantity in your cart according to the available stock and try again.</p><p>If you need assistance, feel free to contact our support team.</p>"
  order-pending: "<p>Hi {{first_name}}, 👋</p><p>We received your order! 🧾</p><p>Thanks for your purchase! Your order has been successfully created and is currently <strong>pending confirmation</strong>.</p><p>We're reviewing the details carefully and will update you very soon with the next steps.</p><p>You can check your order details anytime using the button below.</p><p>If you need anything, our support team is always here to help 💬</p>"
  order-awaiting_payment: "<p>Hi {{first_name}}, 👋</p><p>Almost there! 💳</p><p>Your order is currently <strong>awaiting payment</strong>.</p><p>You're just one step away from completing your purchase. Once your payment is confirmed, we’ll immediately begin preparing your order.</p><p>If you experience any issues, feel free to try again or contact our support team — we're happy to help!</p>"
  order-paid: "<p>Hi {{first_name}}, 👋</p><p>Payment confirmed! 🎉</p><p>Great news! We've successfully received your payment. Our team is now carefully preparing your order to make sure everything arrives perfectly.</p><p>You can check your order details anytime using the button below.</p><p>If you need anything, our support team is always here to help 💬</p>"
  order-payment_failed: "<p>Hi {{first_name}}, 👋</p><p>Oops! Payment issue ❌</p><p>Unfortunately, we couldn’t process your payment. Please try again or contact our support team for assistance.</p><p>Don’t worry, we can help you resolve this quickly. If you need anything, our support team is always here to help 💬</p>"
  order-cancelled: "<p>Hi {{first_name}}, 👋</p><p>Order update 🚫</p><p>Your order has been <strong>cancelled</strong>.</p><p>If this was intentional, no further action is required. If not, don’t worry — our support team is here to assist you and answer any questions you may have.</p><p>We hope to see you again soon! 💙</p>"
  order-shipped: "<p>Hi {{first_name}}, 👋</p><p>Order shipped! 📦</p><p>Great news! Your order has been successfully shipped. Our team is now carefully preparing your order to make sure everything arrives perfectly.</p><p>You can check your order details anytime using the button below.</p><p>If you need anything, our support team is always here to help 💬</p>"
  order-delivered: "<p>Hi {{first_name}}, 👋</p><p>Order delivered! 📦</p><p>Great news! Your order has been successfully delivered. We hope you enjoy your purchase!</p><p>You can check your order details anytime using the button below.</p><p>If you need anything, our support team is always here to help 💬</p>"
