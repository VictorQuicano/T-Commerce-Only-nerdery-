<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <title>{{email_subject}}</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
    body { margin: 0 !important; padding: 0 !important; width: 100% !important; background-color: #0D0D0D; }
    @import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap');
    @media screen and (max-width: 600px) {
      .email-wrapper  { width: 100% !important; }
      .email-body     { padding: 36px 24px !important; }
      .email-header   { padding: 32px 24px !important; }
      .email-footer   { padding: 24px 24px !important; }
      .btn-cta        { width: 100% !important; display: block !important; box-sizing: border-box !important; text-align: center !important; }
      h1              { font-size: 28px !important; line-height: 36px !important; }
    }
  </style>
</head>

<body style="margin:0; padding:0; background-color:#0D0D0D;">

  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
         style="background-color:#EDEDDF; min-width:320px;">
    <tr>
      <td align="center" valign="top" style="padding: 48px 16px;">

        <table role="presentation" class="email-wrapper" cellpadding="0" cellspacing="0" border="0"
               width="580" style="max-width:580px; width:100%;">

          <!-- ── HEADER ── -->
          <tr>
            <td class="email-header"
                style="background: linear-gradient(135deg, #FF6B00 0%, #FF9A3C 60%, #FFD166 100%);
                       padding: 40px 48px 36px; border-radius: 12px 12px 0 0; position:relative;">

              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                  <td>
                    <!-- Logo row -->
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td style="vertical-align: middle; padding-right: 12px;">
                          <!-- Icon badge -->
                          <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                              <td style="width:40px; height:40px;
                                         background-color: rgba(0,0,0,0.18);
                                         border-radius: 10px;
                                         text-align:center; vertical-align:middle;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="#FFFFFF" viewBox="0 0 16 16">
                                  <path d="M0 2.5A.5.5 0 0 1 .5 2H2a.5.5 0 0 1 .485.379L2.89 4H14.5a.5.5 0 0 1 .485.621l-1.5 6A.5.5 0 0 1 13 11H4a.5.5 0 0 1-.485-.379L1.61 3H.5a.5.5 0 0 1-.5-.5M3.14 5l1.25 5h8.22l1.25-5zM5 13a1 1 0 1 0 0 2 1 1 0 0 0 0-2m-2 1a2 2 0 1 1 4 0 2 2 0 0 1-4 0m9-1a1 1 0 1 0 0 2 1 1 0 0 0 0-2m-2 1a2 2 0 1 1 4 0 2 2 0 0 1-4 0"/>
                                </svg>
                              </td>
                            </tr>
                          </table>
                        </td>
                        <td style="vertical-align: middle;">
                          <span style="font-family: 'Open Sans', sans-serif;
                                       font-size: 20px; font-weight: 800;
                                       color: #FFFFFF;
                                       letter-spacing: 1px;
                                       text-transform: uppercase;">
                            T-Commerce
                          </span>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>

                <!-- Big display text in header -->
                <tr>
                  <td style="padding-top: 32px;">
                    <p style="font-family: 'Outfit', Helvetica, Arial, sans-serif;
                               font-size: 11px; font-weight: 500;
                               letter-spacing: 3px; text-transform: uppercase;
                               color: rgba(255,255,255,0.7);
                               margin: 0 0 10px 0;">
                      {{email_greeting}}
                    </p>
                    <h1 style="font-family: 'Open Sans', sans-serif;
                                font-size: 34px; line-height: 42px;
                                font-weight: 600;
                                color: #FFFFFF;
                                margin: 0;
                               
                                letter-spacing: -0.5px;">
                      {{email_title}}
                    </h1>
                  </td>
                </tr>
              </table>

              <!-- Decorative shape bottom-right -->
              <div style="position:absolute; bottom:0; right:0; width:120px; height:120px;
                          background:rgba(255,255,255,0.07); border-radius:60px 0 0 0;
                          overflow:hidden; font-size:0; line-height:0;">
              </div>
            </td>
          </tr>

          <!-- Accent bar -->
          <tr>
            <td style="height:4px;
                       background: linear-gradient(90deg, #FAFAFA 0%, #FF6B00 30%, #FFD166 70%, #FAFAFA 100%);
                       font-size:0; line-height:0;">&nbsp;</td>
          </tr>

          <!-- ── BODY ── -->
          <tr>
            <td class="email-body"
                style="background-color:#FAFAFA; padding: 48px 48px 40px;">

              <p style="font-family: 'Outfit', Helvetica, Arial, sans-serif;
                         font-size: 16px; line-height: 28px;
                         color: #333232;
                         margin: 0 0 36px 0;">
                {{email_body}}
              </p>

              <!-- CTA Button -->
              <!--[if !mso]><!-->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
                     style="margin-bottom: 12px;">
                <tr>
                  <td align="left">
                    <a href="{{button_url}}"
                       class="btn-cta"
                       target="_blank"
                       style="font-family: 'Outfit', Helvetica, Arial, sans-serif;
                              font-size: 13px; font-weight: 500;
                              letter-spacing: 2.5px;
                              text-transform: uppercase;
                              color: #0D0D0D !important;
                              background: linear-gradient(90deg, #FF6B00 0%, #FFD166 100%);
                              text-decoration: none;
                              padding: 17px 40px;
                              display: inline-block;
                              border-radius: 6px;
                              mso-padding-alt: 17px 40px;">
                      {{button_text}} &nbsp;→
                    </a>
                  </td>
                </tr>
              </table>
              <!--<![endif]-->

              <!-- Outlook fallback -->
              <!--[if mso]>
              <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml"
                           xmlns:w="urn:schemas-microsoft-com:office:word"
                           href="{{button_url}}"
                           style="height:52px; v-text-anchor:middle; width:220px;"
                           arcsize="4%" strokecolor="#FF6B00" fillcolor="#FF6B00">
                <w:anchorlock/>
                <center style="color:#0D0D0D; font-family:Helvetica,Arial,sans-serif;
                               font-size:13px; letter-spacing:2px; text-transform:uppercase;">
                  {{button_text}}
                </center>
              </v:roundrect>
              <![endif]-->

              <!-- Fallback link -->
              <p style="font-family: 'Outfit', Helvetica, Arial, sans-serif;
                         font-size: 12px; color: #555555;
                         margin: 20px 0 0 0; line-height: 20px;">
                If the button does not work, copy and paste this link:<br/>
                <a href="{{button_url}}" style="color:#FF9A3C; text-decoration:underline; word-break:break-all;">
                  {{button_url}}
                </a>
              </p>

            </td>
          </tr>

          <!-- Divider line -->
          <tr>
            <td style="height:1px; background-color:#FFC140; font-size:0; line-height:0;">&nbsp;</td>
          </tr>

          <!-- ── FOOTER ── -->
          <tr>
            <td class="email-footer"
                style="background-color:#F5F5E9; padding: 24px 48px; border-radius: 0 0 12px 12px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                  <td>
                    <!-- Logo small -->
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                      <tr>
                        <td align="left" valign="middle">
                          <span style="font-family: 'Open Sans', sans-serif;
                                       font-size: 14px; font-weight: 600;
                                       color: #FF6B00;
                                       letter-spacing: 1px;
                                       text-transform: uppercase;">
                            T-Commerce
                          </span>
                        </td>
                        <td align="right" valign="middle">
                          <p style="font-family:'Outfit',Helvetica,Arial,sans-serif;
                                     font-size:11px; color:#444444;
                                     line-height:16px; margin:0;">
                            © {{year}} All rights reserved.
                          </p>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
        <!-- /Card -->

      </td>
    </tr>
  </table>

</body>
</html>
