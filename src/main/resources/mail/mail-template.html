<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <title>{{email_subject}}</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
    /* Reset */
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
    body { margin: 0 !important; padding: 0 !important; width: 100% !important; background-color: #F0F2E4; }

    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap');

    /* Mobile */
    @media screen and (max-width: 600px) {
      .email-wrapper  { width: 100% !important; }
      .email-body     { padding: 32px 24px !important; }
      .email-header   { padding: 28px 24px !important; }
      .email-footer   { padding: 24px 24px !important; }
      .btn-wrapper    { text-align: center !important; }
      .btn-cta        { width: 100% !important; display: block !important; box-sizing: border-box !important; }
      h1              { font-size: 26px !important; line-height: 34px !important; }
    }
  </style>
</head>

<body style="margin:0; padding:0; background-color:#F2EDE8;">

  <!-- Wrapper exterior -->
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
         style="background-color:#F2EDE8; min-width:320px;">
    <tr>
      <td align="center" valign="top" style="padding: 40px 16px;">

        <!-- Card principal -->
        <table role="presentation" class="email-wrapper" cellpadding="0" cellspacing="0" border="0"
               width="560" style="max-width:560px; width:100%; border-radius:4px; overflow:hidden;
               box-shadow: 0 4px 24px rgba(0,0,0,0.08);">

          <!-- ── HEADER ── -->
          <tr>
            <td class="email-header" align="center"
                style="background-color:#CC5803; padding: 36px 40px;">

              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                  <td align="center">
                    <div style="display:inline-block; margin-bottom:14px;">
                      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                        <tr>
                          <td style="width:36px; height:36px; background-color:#fff;  
                                     border-radius:50%; text-align:center; vertical-align:middle;
                                     font-size:18px; line-height:36px;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#CC5803" class="bi bi-cart2" viewBox="0 0 16 16">
  <path d="M0 2.5A.5.5 0 0 1 .5 2H2a.5.5 0 0 1 .485.379L2.89 4H14.5a.5.5 0 0 1 .485.621l-1.5 6A.5.5 0 0 1 13 11H4a.5.5 0 0 1-.485-.379L1.61 3H.5a.5.5 0 0 1-.5-.5M3.14 5l1.25 5h8.22l1.25-5zM5 13a1 1 0 1 0 0 2 1 1 0 0 0 0-2m-2 1a2 2 0 1 1 4 0 2 2 0 0 1-4 0m9-1a1 1 0 1 0 0 2 1 1 0 0 0 0-2m-2 1a2 2 0 1 1 4 0 2 2 0 0 1-4 0"/>
</svg>
                          </td>
                        </tr>
                      </table>
                    </div>
                    <br/>
                    <span style="font-family: 'DM Serif Display', Georgia, 'Times New Roman', serif;
                                 font-size: 22px; color: #F2EDE8; letter-spacing: 3px;
                                 text-transform: uppercase; display:block;">
                      T-Commerce
                    </span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="height:3px; background: linear-gradient(90deg, #FF9505 0%, #E8D5A3 50%, #FFC971 100%);
                        font-size:0; line-height:0;">&nbsp;</td>
          </tr>

          <tr>
            <td class="email-body" style="background-color:#FFFFFF; padding: 48px 48px 40px;">

              <p style="font-family: 'DM Sans', Helvetica, Arial, sans-serif;
                         font-size: 13px; font-weight:500; color:#FF9505;
                         letter-spacing: 2px; text-transform:uppercase;
                         margin: 0 0 16px 0;">
                {{email_greeting}}
              </p>

              <h1 class="h1" style="font-family: 'DM Serif Display', Georgia, 'Times New Roman', serif;
                          font-size: 30px; line-height: 40px; color: #1A1A18;
                          margin: 0 0 24px 0; font-weight: 400;">
                {{email_title}}
              </h1>

              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="48"
                     style="margin-bottom:28px;">
                <tr>
                  <td style="height:2px; background-color:#FF9505; font-size:0; line-height:0;">&nbsp;</td>
                </tr>
              </table>

              <p style="font-family: 'DM Sans', Helvetica, Arial, sans-serif;
                         font-size: 15px; line-height: 26px; color: #4A4A46;
                         margin: 0 0 32px 0;">
                {{email_body_text}}
              </p>
              
              <!--[if !mso]><!-->
              <table role="presentation" class="btn-wrapper" cellpadding="0" cellspacing="0" border="0"
                     width="100%" style="margin-bottom: 8px;">
                <tr>
                  <td align="left">
                    <a href="{{button_url}}"
                       class="btn-cta"
                       target="_blank"
                       style="font-family: 'DM Sans', Helvetica, Arial, sans-serif;
                              font-size: 13px; font-weight: 500; letter-spacing: 2px;
                              text-transform: uppercase; color: #FFFFFF !important;
                              background-color: #1A1A18; text-decoration: none;
                              padding: 16px 36px; display: inline-block;
                              border-radius: 2px; mso-padding-alt: 16px 36px;">
                      {{button_text}}
                    </a>
                  </td>
                </tr>
              </table>
              <!--<![endif]-->

              <!-- Fallback para Outlook -->
              <!--[if mso]>
              <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml"
                           xmlns:w="urn:schemas-microsoft-com:office:word"
                           href="{{button_url}}"
                           style="height:50px; v-text-anchor:middle; width:200px;"
                           arcsize="2%" strokecolor="#1A1A18" fillcolor="#1A1A18">
                <w:anchorlock/>
                <center style="color:#ffffff; font-family:Helvetica,Arial,sans-serif;
                               font-size:13px; letter-spacing:2px; text-transform:uppercase;">
                  {{button_text}}
                </center>
              </v:roundrect>
              <![endif]-->


              <p style="font-family: 'DM Sans', Helvetica, Arial, sans-serif;
                         font-size: 12px; color: #AAAAAA; margin: 20px 0 0 0; line-height:20px;">
                If the button does not work, copy and paste this link into your browser:<br/>
                <a href="{{button_url}}" style="color:#C8A96E; text-decoration:underline;">
                  {{button_url}}
                </a>
              </p>

            </td>
          </tr>

          <!-- ── FOOTER ── -->
          <tr>
            <td class="email-footer"
                style="background-color:#F7F4F0; padding: 28px 48px; border-top: 1px solid #E8E2DA;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">

                <tr>
                  <td align="center">
                    <p style="font-family:'DM Sans',Helvetica,Arial,sans-serif;
                               font-size:11px; color:#AAAAAA; line-height:18px; margin:0;">
                      T-Commerce <br/>
                      © {{year}} All rights reserved.<br/><br/>
                    </p>
                  </td>
                </tr>

              </table>
            </td>
          </tr>

        </table>
        <!-- /Card principal -->

      </td>
    </tr>
  </table>

</body>
</html>
